name: Thamar Solorio
title: Professor of Natural Language Processing
tagline: Leading innovative research in multilingual and multimodal NLP and mentoring the next generation of scientists.
photo: uploads/leader/Thamar Solorio.jpeg
email: thamar.solorio@mbzuai.ac.ae
twitter: https://twitter.com/thamar_solorio
scholar: https://scholar.google.com/citations?user=Gmjwy-IAAAAJ&hl=en
bio:
  - I jonied MBZUAI in 2023, prior to joining I was a Professor of Computer Science at the University of Houston where I founded and directed the Research in Text Understanding and Analysis Lab (RiTUAL). My research interest spans problems in the areas of multilinguality, mental health, artificial social intelligence and more recently problems involving speech and other modalities. I care about how the methods we develop can be easily or more efficiently adapted to other languages and how we can build technology for the universe of diverse linguistic communities.
  - I received an NSF CAREER award for my work on authorship attribution in 2014 and the 2014 Emerging Leader ABIE Award in Honor of Denice Denton. I served to terms as an elected board member of the Nations of the Americas Chapter of the Association for Computational Linguistics (NAACL) and was Program Committee co‑chair for NAACL 2019. She was Co‑Editor‑in‑Chief for the ACL Rolling Review (ARR) system from 2022-2024, served as a member of the ARR advisory board.
interests:
  - Multilingual Natural Language Processing (NLP)
  - Low‑resource and efficient NLP
  - Information extraction
  - Artificial Social Intelligence
  - NLP for mental health
