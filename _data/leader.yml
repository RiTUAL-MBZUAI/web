name: Thamar Solorio
title: Professor of Natural Language Processing
tagline: Leading innovative research in multilingual and multimodal NLP and mentoring the next generation of scientists.
photo: uploads/leader/Thamar Solorio.jpg
email: thamar.solorio@mbzuai.ac.ae
twitter: https://twitter.com/thamar_solorio
scholar: https://scholar.google.com/citations?user=Gmjwy-IAAAAJ&hl=en
bio:
  - I jonied MBZUAI in 2023, prior to joining I was a Professor of Computer Science at the University of Houston where I founded and directed the Research in Text Understanding and Analysis Lab (RiTUAL). My research interest spans problems in the areas of multilinguality, mental health, artificial social intelligence and more recently problems involving speech and other modalities.
  - Professor Solorio received an NSF CAREER award for her work on authorship attribution in 2014 and the 2014 Emerging Leader ABIE Award in Honor of Denice Denton. She is currently serving a second term as an elected board member of the North American Chapter of the Association for Computational Linguistics (NAACL) and was Program Committee co‑chair for NAACL 2019. She is co‑Editor‑in‑Chief for the ACL Rolling Review (ARR) system, a member of the ARR advisory board, and holds a US patent awarded in 2022 for work on recommendation systems for books.
interests:
  - Multilingual Natural Language Processing
  - Low‑resource machine learning
  - Multimodal information extraction
